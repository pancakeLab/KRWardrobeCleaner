name: Build and Release

# push / PR: build only (artifact). Releases are made by hand with "Run workflow":
#   release = true, prerelease = true  -> Dalamud 테스트 채널용 prerelease
#   release = true, prerelease = false -> 안정판
# The Dalamud repo file (pluginmaster.json) lives in pancakeLab/Himechan_addon and is updated with
# .github/himechan/wardrobe-release.ps1 there (use -SkipRelease after a release made here).

on:
  push:
    branches: [ main ]
    paths:
      - "KRWardrobeCleaner/**"
      - ".github/workflows/build-release.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '릴리스 만들기 (vX.Y.Z.W 태그)'
        type: boolean
        default: false
      prerelease:
        description: '테스트 빌드(prerelease)로 표시'
        type: boolean
        default: true
      notes:
        description: '릴리스 노트 (선택)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud dev files
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA "XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "latest.zip"
          Expand-Archive -Force "latest.zip" $dest

      - name: Build
        shell: pwsh
        run: dotnet build ".\KRWardrobeCleaner\KRWardrobeCleaner.csproj" --configuration Release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $project = [xml](Get-Content ".\KRWardrobeCleaner\KRWardrobeCleaner.csproj")
          $version = [string]$project.Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

          $root = ".\KRWardrobeCleaner\bin\Release"
          $dll = Get-ChildItem $root -Recurse -File -Filter "KRWardrobeCleaner.dll" | Select-Object -First 1
          $manifest = Get-ChildItem $root -Recurse -File -Filter "KRWardrobeCleaner.json" | Select-Object -First 1
          if ($null -eq $dll -or $null -eq $manifest) { throw "build output not found" }

          $m = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          if ($m.AssemblyVersion -ne $version) { throw "manifest AssemblyVersion $($m.AssemblyVersion) != csproj $version" }

          New-Item -ItemType Directory -Force -Path ".\package" | Out-Null
          Copy-Item $dll.FullName ".\package\KRWardrobeCleaner.dll" -Force
          Copy-Item $manifest.FullName ".\package\KRWardrobeCleaner.json" -Force
          Compress-Archive -Path ".\package\*" -DestinationPath ".\KRWardrobeCleaner.zip" -Force

          $zipHash = (Get-FileHash ".\KRWardrobeCleaner.zip" -Algorithm SHA256).Hash
          Set-Content ".\SHA256SUMS.txt" "KRWardrobeCleaner.zip  $zipHash"
          "zip_sha256=$zipHash" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRWardrobeCleaner-${{ steps.package.outputs.version }}
          path: |
            KRWardrobeCleaner.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          $lines = @("히메짱 옷장 정리기 $env:VERSION")
          if ($env:NOTES) { $lines += ""; $lines += $env:NOTES }
          $lines += ""; $lines += "- KRWardrobeCleaner.zip SHA256: ${{ steps.package.outputs.zip_sha256 }}"
          Set-Content ".\notes.md" ($lines -join "`n")

          $prevEap = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
          gh release view $env:TAG 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap

          $title = "히메짱 옷장 정리기 $env:VERSION"
          if ($env:PRERELEASE -eq 'true') { $title += " (테스트)" }
          if (-not $exists) {
            $extra = @()
            if ($env:PRERELEASE -eq 'true') { $extra += "--prerelease"; $extra += "--latest=false" }
            gh release create $env:TAG ".\KRWardrobeCleaner.zip#Dalamud install package" ".\SHA256SUMS.txt#SHA-256 checksums" --title $title --notes-file ".\notes.md" @extra
          } else {
            gh release upload $env:TAG ".\KRWardrobeCleaner.zip#Dalamud install package" ".\SHA256SUMS.txt#SHA-256 checksums" --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }

      - name: Build summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## 히메짱 옷장 정리기 ${{ steps.package.outputs.version }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "- ZIP SHA-256: ${{ steps.package.outputs.zip_sha256 }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Dalamud 저장소 주소: https://raw.githubusercontent.com/pancakeLab/Himechan_addon/himechan/pluginmaster.json"
